name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: Documentation quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: ruby scripts/check_docs.rb
      - run: npx --yes markdownlint-cli2@0.20.0 '**/*.md'
  rust:
    name: Rust quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, windows-2025, macos-15] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 test --workspace --locked
      - run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
