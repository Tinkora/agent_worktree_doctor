name: Supply chain
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "31 4 * * 1" }]
permissions: { contents: read }
concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - run: cargo +1.88.0 deny check advisories bans licenses sources
      - run: cargo +1.88.0 audit
