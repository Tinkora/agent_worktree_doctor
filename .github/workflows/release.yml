name: Release
on:
  push: { tags: ["v*.*.*"] }
permissions: { contents: read }
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Validate annotated tag and main CI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]
          grep -Fq "## [${version}]" CHANGELOG.md
          [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" == tag ]]
          [[ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" == "${GITHUB_SHA}" ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]]
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          for attempt in {1..40}; do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&per_page=10" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA)][0].conclusion // "pending"')"
            [[ "${conclusion}" == success ]] && break
            [[ "${conclusion}" != failure && "${attempt}" -lt 40 ]]
            sleep 15
          done
      - run: |
          ruby scripts/test_release_workflow.rb
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --no-self-update
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test --locked
          cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: macos-15, target: x86_64-apple-darwin, ext: "" }
          - { os: macos-15, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.85.0
          cargo +1.85.0 build --release --locked --target "${{ matrix.target }}"
          asset="agent_worktree_doctor-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "staging/${asset}" dist
          cp "target/${{ matrix.target }}/release/agent_worktree_doctor${{ matrix.ext }}" "staging/${asset}/"
          cp README.md README.zh-CN.md CHANGELOG.md LICENSE "staging/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C staging "${asset}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "agent_worktree_doctor-${{ matrix.target }}", path: "dist/*", if-no-files-found: error, retention-days: 7 }
  evidence:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 install cargo-cyclonedx --version 0.5.9 --locked
          cargo +1.85.0 cyclonedx --format json --describe crate --spec-version 1.5
          mkdir dist
          mv agent_worktree_doctor.cdx.json dist/SBOM.cdx.json
          cargo +1.85.0 metadata --locked --format-version 1 | jq '[.packages[] | {name,version,license}]' > dist/LICENSES.json
          jq -n --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" --arg tag "${GITHUB_REF_NAME}" '{schema_version:1,repository:$repository,commit:$sha,tag:$tag}' > dist/RELEASE_EVIDENCE.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: agent_worktree_doctor-evidence, path: "dist/*", if-no-files-found: error, retention-days: 7 }
  publish:
    needs: [build, evidence]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }
      - name: Verify exact asset inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "agent_worktree_doctor-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
            "agent_worktree_doctor-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
            "agent_worktree_doctor-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.tar.gz"
            "agent_worktree_doctor-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            LICENSES.json RELEASE_EVIDENCE.json SBOM.cdx.json
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          (cd dist && sha256sum -- "${expected[@]}" > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*.tar.gz" }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with: { subject-path: "dist/*.tar.gz", predicate-type: "https://cyclonedx.org/bom", predicate-path: dist/SBOM.cdx.json }
      - name: Publish only after remote asset revalidation
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "agent_worktree_doctor-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz"
            "agent_worktree_doctor-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz"
            "agent_worktree_doctor-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.tar.gz"
            "agent_worktree_doctor-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            LICENSES.json RELEASE_EVIDENCE.json SBOM.cdx.json SHA256SUMS
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          args=(--draft --verify-tag --generate-notes)
          [[ "${GITHUB_REF_NAME}" != *-* ]] || args+=(--prerelease)
          release_id=""
          draft_created=false
          cleanup() {
            if [[ -n "${release_id}" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}" >/dev/null || true
            elif [[ "${draft_created}" == true ]]; then
              gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" "${args[@]}"
          draft_created=true
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .id)"
          mkdir downloaded
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir downloaded
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(find downloaded -maxdepth 1 -type f -printf '%f\n' | sort)
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          cp dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check --strict SHA256SUMS)
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false >/dev/null
          release_id=""
          trap - EXIT
