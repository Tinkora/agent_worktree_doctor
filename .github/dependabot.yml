version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Shanghai }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 2
    groups:
      cargo-patch-minor: { update-types: [patch, minor] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "09:15", timezone: Asia/Shanghai }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 2
    groups:
      actions-patch-minor: { update-types: [patch, minor] }
