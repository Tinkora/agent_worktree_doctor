[package]
name = "agent_worktree_doctor"
version = "0.1.0-alpha.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Privacy-safe offline diagnostics for Git worktree metadata"
repository = "https://github.com/Tinkora/agent_worktree_doctor"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
